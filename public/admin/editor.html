<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<title>E Daniel Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap">
<link rel="stylesheet" href="admin.css">
<style>
/* v37: look and feel, voice, music, pets */
.colrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.colrow input[type=color] { width: 56px; height: 48px; padding: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.colrow code { font: 600 13px var(--mono); color: var(--ink2); }
.sws { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.sw { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); }
.sw[aria-pressed="true"] { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }
.rng { display: grid; gap: 4px; }
.rng input[type=range] { width: 100%; min-height: 40px; accent-color: var(--accent); }
.rng .rd { font: 700 13px var(--mono); color: var(--ink); }
.rng .rh { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink2); }
.thprev { border-radius: 14px; padding: 16px; display: grid; gap: 10px; border: 1px solid rgba(128,128,128,.35); }
.thprev .pc { padding: 14px; display: grid; gap: 8px; border: 1px solid rgba(128,128,128,.3); }
.thprev b { font-size: 22px; letter-spacing: .04em; }
.thprev .pb { justify-self: start; padding: 10px 18px; border-radius: 8px; color: #fff; font-weight: 700; }
.warn { padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 13px; font-weight: 600; }
.pbtn { min-width: 44px; min-height: 44px; }
.pimg { width: 64px; height: 64px; border-radius: 12px; object-fit: contain; background: var(--surface2); flex: 0 0 auto; }
.prow { display: flex; gap: 12px; align-items: center; min-width: 0; }
.prow .tx { min-width: 0; flex: 1 1 auto; }
.mrow { display: grid; gap: 10px; }
.mrow .rec-a .btn { min-height: 44px; }
</style>
</head>
<body>
<div class="wrap">

<section class="login" id="gate" hidden>
  <div class="brand"><span class="brand-mark">ED</span><div><small>Owner only</small></div></div>
  <h1>Editor</h1>
  <p class="sub" id="gateSub">Please sign in on the admin page first. Then come back here.</p>
  <a class="btn primary" href="index.html">Go to sign-in</a>
</section>

<div id="desk" hidden>
  <header class="top">
    <div class="top-row">
      <div class="brand"><span class="brand-mark">ED</span><div><h1>Editor</h1><small>Add, change, remove</small></div></div>
      <div class="top-links"><a class="btn sm" href="index.html">Dashboard</a><a class="btn sm" href="../">Website</a></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="What to edit" id="tabs"></nav>
  </header>
  <main>
    <div class="banner" id="demoBanner" hidden><b>Preview.</b> Changes stay in this browser only. On your Netlify site, “Save and publish” updates the live website for everyone.</div>
    <div class="banner" id="errBanner" hidden></div>
    <section id="panel" style="display:grid;gap:14px"></section>
  </main>
</div>
</div>

<div class="savebar" id="saveBar" hidden>
  <span class="st" id="saveSt">No changes yet</span>
  <button class="btn primary" id="saveBtn" type="button" disabled>Save and publish</button>
</div>
<datalist id="plats"><option>Instagram</option><option>YouTube</option><option>Facebook</option><option>Snapchat</option><option>Moj</option><option>Telegram</option><option>LinkedIn</option><option>X</option><option>Threads</option><option>Pinterest</option><option>Behance</option><option>Discord</option><option>GitHub</option><option>Reddit</option><option>Twitch</option><option>Spotify</option><option>Website</option></datalist>
<div id="sheetHost"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="api.js"></script>
<script src="builtin.js"></script>
<script>
(function () {
  'use strict';
  var A = window.Admin, esc = A.esc, B = window.BUILTIN || { lists: {}, availability: '', daily: [], socials: [], words: {}, i18n: {} };
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };
  var rid = function () { return Math.random().toString(36).slice(2, 8); };
  var today = function () { return new Date().toISOString().slice(0, 10); };
  var TAGS = [['creator', 'Creator edit'], ['vfx', 'VFX edit'], ['work', 'Work & long-form']];
  var HELP0 = {
    on: true, title: 'Books & toys for children',
    intro: 'Some children in orphanages and poor homes have no books to read and no toys to play with. Tips from this site go to food, education and basic needs. You can also give books, toys, clothes or food. Tell me what you can give and I will get back to you.',
    note: 'Pledges go only to Danu Sir. Send money only to the UPI ID shown in the Tip or pay card.', dropMode: 'hidden', address: '', hours: '',
    needs: [
      { id: 'n1', kind: 'books', title: 'Story books and school books', note: 'Picture books, story books and textbooks in good condition, any language.', have: 0, need: 0 },
      { id: 'n2', kind: 'toys', title: 'Toys and games', note: 'Clean toys, board games, balls, puzzles and art supplies.', have: 0, need: 0 },
      { id: 'n3', kind: 'clothes', title: 'Clothes', note: 'Clean, usable clothes for children of any age.', have: 0, need: 0 },
      { id: 'n4', kind: 'food', title: 'Food and groceries', note: 'Packed, unopened food and groceries that keep well.', have: 0, need: 0 }
    ], stories: []
  };

  /* Translation fields: the page shows these when a visitor picks Tamil, Kannada, Hindi or Telugu. Empty means the English shows. */
  var TR_LANGS = [['ta', 'Tamil'], ['kn', 'Kannada'], ['hi', 'Hindi'], ['te', 'Telugu']];
  function TR_FIELDS(keys, what) {
    var out = [];
    TR_LANGS.forEach(function (lg) {
      keys.forEach(function (k) {
        var big = k === 'body', note = k === 'note';
        out.push({ k: k + '_' + lg[0], t: big || note ? 'area' : undefined, rows: big ? 8 : undefined, l: (k === 'body' ? 'The ' + what : k === 'title' ? 'Title' : k === 'kicker' ? 'Label' : 'Card note') + ' in ' + lg[1] + ' (optional)' });
      });
    });
    return out;
  }
  /* What each list can edit. t: text, area, image, select, tags, num */
  var LISTS = {
    reels: { label: 'Reels', noun: 'reel', thumb: 'poster', sub: function (x) { return [x.dur, x.ratio].filter(Boolean).join(' · '); }, blank: function () { return { title: '', src: '', poster: '', dur: '', ratio: 'portrait', tags: ['creator'], desc: '' }; },
      fields: [{ k: 'title', l: 'Title', req: 1 }, { k: 'src', l: 'Video file or link', hint: 'A file already on the site, for example videos/new-reel.mp4, or a direct link to the video.', req: 1 }, { k: 'poster', t: 'image', l: 'Cover picture' }, { k: 'desc', t: 'area', l: 'Short description' }, { k: 'dur', l: 'Length, for example 0:40' }, { k: 'ratio', t: 'select', l: 'Shape', o: [['portrait', 'Portrait'], ['landscape', 'Landscape'], ['square', 'Square']] }, { k: 'tags', t: 'tags', l: 'Show under' }] },
    topPicks: { label: 'Top picks', noun: 'top pick', thumb: 'poster', sub: function (x) { return [x.dur, x.ratio].filter(Boolean).join(' · '); }, blank: function () { return { title: '', src: '', poster: '', dur: '', ratio: 'portrait', tags: ['creator'], desc: '' }; } },
    photos: { label: 'Photos', noun: 'photo', thumb: 'src', sub: function (x) { return x.cap || ''; }, blank: function () { return { title: '', cap: '', src: '' }; },
      fields: [{ k: 'title', l: 'Title', req: 1 }, { k: 'cap', l: 'Caption' }, { k: 'src', t: 'image', l: 'Photo', req: 1 }] },
    certificates: { label: 'Awards', noun: 'award', thumb: 'src', sub: function (x) { return [x.org, x.year].filter(Boolean).join(' · '); }, blank: function () { return { src: '', cat: 'school', title: '', org: '', year: '', note: '' }; },
      fields: [{ k: 'title', l: 'Title', req: 1 }, { k: 'org', l: 'Given by' }, { k: 'year', l: 'Year' }, { k: 'note', l: 'What it was for' }, { k: 'cat', t: 'select', l: 'Group', o: [['sports', 'Sports'], ['school', 'School and academic'], ['art', 'Art awards']] }, { k: 'src', t: 'image', l: 'Picture of the certificate' }] },
    poems: { label: 'Poems', noun: 'poem', thumb: 'art', sub: function (x) { return String(x.body || '').split('\n')[0]; }, blank: function () { return { title: '', art: '', body: '' }; },
      fields: [{ k: 'title', l: 'Poem title', req: 1 }, { k: 'body', t: 'area', l: 'The poem', rows: 10, req: 1 }, { k: 'art', t: 'image', l: 'Drawing for the poem' }].concat(TR_FIELDS(['title', 'body'], 'poem')) },
    tutor: { label: 'Tutor', noun: 'tutor item', thumb: '', sub: function (x) { return [x.price, x.desc].filter(Boolean).join(' · '); }, blank: function () { return { title: '', desc: '', price: '' }; },
      fields: [{ k: 'title', l: 'Name of the item', req: 1 }, { k: 'desc', t: 'area', l: 'What the student gets' }, { k: 'price', l: 'Price, for example ₹199' }] },
    prices: { label: 'Prices', noun: 'price', thumb: '', sub: function (x) { return [x.price, x.note].filter(Boolean).join(' · '); }, blank: function () { return { name: '', price: '', note: '' }; },
      fields: [{ k: 'name', l: 'What it is for, for example Reel edit', req: 1 }, { k: 'price', l: 'Price, for example ₹500 per reel' }, { k: 'note', t: 'area', l: 'Note' }] }
  };
  LISTS.stories = { label: 'Stories', noun: 'story', top: 'stories', thumb: 'art', sub: function (x) { return [x.kicker, String(x.body || '').length + ' characters'].filter(Boolean).join(' · '); }, blank: function () { return { title: '', kicker: 'Short story', art: '', note: '', body: '' }; },
    fields: [{ k: 'title', l: 'Title', req: 1 }, { k: 'kicker', l: 'Label above the title, for example Short novel · excerpt' }, { k: 'note', t: 'area', l: 'Short note shown on the card' }, { k: 'body', t: 'area', l: 'The story or letter', rows: 14, req: 1 }, { k: 'art', t: 'image', l: 'Cover picture' }].concat(TR_FIELDS(['title', 'kicker', 'note', 'body'], 'story')) };
  LISTS.socials = { label: 'Social links', noun: 'social link', top: 'socials', thumb: '', sub: function (x) { return [x.handle, x.count].filter(Boolean).join(' · '); }, blank: function () { return { label: '', handle: '', url: '', count: '' }; },
    fields: [{ k: 'label', l: 'App or site, for example Telegram', req: 1, dl: 'plats' }, { k: 'handle', l: 'Your name there, for example @danu_edits' }, { k: 'url', l: 'Link, starting with https://', req: 1, hint: 'Open your profile in the app, tap Share, then Copy link, and paste it here.' }, { k: 'count', l: 'Followers note (optional), for example 1.2K followers' }] };
  LISTS.topPicks.fields = LISTS.reels.fields;
  LISTS.topPicks.label = 'Top picks';
  var TABS = [['daily', 'Daily update'], ['help', 'Children’s help'], ['collab', 'Collaboration & forms'], ['reels', 'Reels'], ['topPicks', 'Top picks'], ['photos', 'Photos'], ['certificates', 'Awards'], ['poems', 'Poems'], ['stories', 'Stories'], ['words', 'Letters & words'], ['social', 'Social links'], ['lang', 'Language'], ['tutor', 'Tutor'], ['prices', 'Prices'], ['status', 'Status line'], ['look', 'Look & feel'], ['voice', 'Voice & sound'], ['music', 'Music'], ['pets', 'Pets']];

  var COLLAB0 = { on: true, title: 'Collaborate and stay in touch', intro: 'Want to work together, contribute to the children’s book drive, or just hear about new work? Choose what fits. Everything is optional, and only Danu Sir sees what you send.', note: '', items: [
    { id: 'c1', title: 'Brand reels and shoutouts', note: 'Sponsored reels, product shorts and shoutouts for your brand.' }, { id: 'c2', title: 'Joint videos', note: 'Co-create a video, a challenge or a series with another creator.' },
    { id: 'c3', title: 'Projects for children', note: 'Books, toys, teaching videos and drives that help children in need.' }, { id: 'c4', title: 'Editing partnerships', note: 'Long-term work with a studio, a channel or a wedding team.' }] };
  var FORMS0 = { bioAsk: true, hireAsk: true, shareAsk: true, robotAsk: true, bioRequire: true, hireRequire: true };
  var LANGS = [['ta', 'Tamil'], ['kn', 'Kannada'], ['hi', 'Hindi'], ['te', 'Telugu']];
  var S = { tab: 'daily', saved: {}, lists: {}, daily: [], help: clone(HELP0), avail: B.availability || '', dirty: false, armed: '', words: null, collab: null, forms: null, i18n: {}, lang: 'ta', lq: '', langAll: false, theme: null, effects: null, voice: null, music: null, pets: null, play: -1, busy: false };

  /* ---------- sign-in ---------- */
  A.onSignedOut = function () { $('#desk').hidden = true; $('#saveBar').hidden = true; $('#gate').hidden = false; $('#gateSub').textContent = 'Your session ended. Please sign in again on the admin page.'; };
  A.status().then(function (s) {
    if (s.offline || !s.configured || !s.signedIn) { $('#gate').hidden = false; if (s.offline) $('#gateSub').textContent = 'The admin server is not reachable from this address. Open this page on your Netlify site.'; return; }
    start();
  });
  function start() {
    $('#desk').hidden = false; $('#saveBar').hidden = false; $('#demoBanner').hidden = !A.demo;

      if (c.help) S.help = Object.assign(clone(HELP0), clone(c.help));
      if (c.availability) S.avail = c.availability;
      S.theme = c.theme ? clone(c.theme) : null; S.effects = c.effects ? clone(c.effects) : null; S.voice = c.voice ? clone(c.voice) : null; S.music = c.music ? clone(c.music) : null; S.pets = c.pets ? clone(c.pets) : null;
      render();
    }).catch(function (e) { $('#errBanner').hidden = false; $('#errBanner').textContent = e.message; });
  }

  function mark() { S.dirty = true; $('#saveBtn').disabled = false; $('#saveSt').textContent = 'You have changes that are not published yet'; }
  function base(k) { return (B.lists || {})[k] || (k === 'socials' ? B.socials : null) || []; }
  function list(k) { if (S.lists[k] === null) S.lists[k] = clone(base(k)); return S.lists[k]; }

  /* ---------- tabs ---------- */

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]'); if (!b) return; S.tab = b.dataset.tab; S.armed = '';
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) { t.setAttribute('aria-selected', String(t === b)); });
    render(); window.scrollTo(0, 0);
  });

  function render() {
    var p = $('#panel');
    if (S.tab === 'daily') p.innerHTML = dailyHTML();
    else if (S.tab === 'help') p.innerHTML = helpHTML();
    else if (S.tab === 'words') p.innerHTML = wordsHTML();
    else if (S.tab === 'collab') p.innerHTML = collabHTML();
    else if (S.tab === 'lang') p.innerHTML = langHTML();
    else if (S.tab === 'social') p.innerHTML = socialHTML();
    else if (S.tab === 'look') { p.innerHTML = lookHTML(); thPreview(); }
    else if (S.tab === 'voice') p.innerHTML = voiceHTML();
    else if (S.tab === 'music') p.innerHTML = musicHTML();
    else if (S.tab === 'pets') p.innerHTML = petsHTML();
    else if (S.tab === 'status') p.innerHTML = '<div class="card"><h2>Status line</h2><p class="sub">Shown at the top of the site next to “Open to work”.</p><label class="field" style="margin-top:12px">Availability<input id="avail" type="text" maxlength="120" value="' + esc(S.avail) + '"></label></div>';
    else p.innerHTML = listHTML(S.tab);
  }


  /* ---------- Look and feel ---------- */
  var TH0 = { accent: '#e50914', bg: '#0b0b0d', text: '#f4f2ee', font: '', radius: 12, card: '', title: '', heroDim: 0 };
  var ACCENTS = [['#e50914', 'Red (now)'], ['#ff7a00', 'Orange'], ['#f5b301', 'Gold'], ['#2fbf71', 'Green'], ['#18b7c9', 'Teal'], ['#2f7bff', 'Blue'], ['#8e5bff', 'Purple'], ['#ff4fa3', 'Pink']];
  var BGS = [['#0b0b0d', 'Black (now)'], ['#0a1020', 'Midnight blue'], ['#08140f', 'Forest'], ['#14091a', 'Plum'], ['#1a1a1f', 'Charcoal'], ['#f6f4ef', 'Light paper']];

  function contrast(a, b) { var x = lumOf(a), y = lumOf(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }

    return '<div class="card"><h2>Look and feel</h2><p class="sub">Change the colours, letters and mood of the whole website. Nothing changes for visitors until you press Save and publish. “Reset to the original look” puts everything back.</p>' +
      '<div class="thprev" id="thPrev" style="margin-top:12px"><b>E DANIEL</b><div class="pc"><span>This is how a card will look.</span><span class="pb">A button</span></div></div><p class="warn" id="thWarn" hidden style="margin-top:10px"></p></div>' +
      '<div class="card"><h2>Colours</h2><div style="display:grid;gap:16px;margin-top:12px">' +

  }
  // The little sample box follows every change at once, without redrawing the form (so a slider is not interrupted).
  function thPreview() {

        if (t.value.trim() && t.value.trim() !== orig) o[kk] = t.value; else delete o[kk];
        mark(); var cn2 = document.getElementById('langCount'); if (cn2) cn2.textContent = Object.keys(o).length + ' changed by you';
      }
    }
    if (k === 'look' && t.dataset.th) {
      var key = t.dataset.th, val = t.type === 'range' ? +t.value : t.value, th = thset();
      if (key === 'font' || key === 'card') { if (val) th[key] = val; else delete th[key]; } else if (key === 'title') { if (String(val).trim()) th.title = String(val); else delete th.title; } else th[key] = val;
      var rd = P.querySelector('[data-rd="' + key + '"]'); if (rd) rd.textContent = key === 'radius' ? val + ' px' : key === 'heroDim' ? val + ' %' : val;
      mark(); thPreview(); return;
    }
    if (k === 'look' && t.dataset.fxn !== undefined) { efset().intensity = +t.value; var rd2 = P.querySelector('[data-rd="intensity"]'); if (rd2) rd2.textContent = t.value + ' of 5'; mark(); return; }
    if (k === 'voice' && t.dataset.vo) {
      var vk = t.dataset.vo, vs = vset(); vs[vk] = t.type === 'range' ? +t.value : t.value;
      var rd3 = P.querySelector('[data-rd="' + vk + '"]'); if (rd3) rd3.textContent = (+t.value).toFixed(2); mark(); return;
    }
    if (k === 'music') {
      if (t.dataset.mvol !== undefined) { mset().volume = (+t.value) / 100; var rd4 = P.querySelector('[data-rd="volume"]'); if (rd4) rd4.textContent = t.value + ' %'; mark(); return; }
      if (t.dataset.mt !== undefined) { var mrw = t.closest('[data-mi]'); mset().tracks[+mrw.dataset.mi].title = t.value; mark(); return; }
    }
    if (k === 'daily' && t.dataset.df) { var r = t.closest('[data-i]'); S.daily[+r.dataset.i][t.dataset.df] = t.value; mark(); }
    if (k === 'help') {
      if (t.dataset.hf) { S.help[t.dataset.hf] = t.value; mark(); }
      if (t.dataset.nf) { var r2 = t.closest('[data-ni]'), nn = S.help.needs[+r2.dataset.ni], f = t.dataset.nf; nn[f] = (f === 'have' || f === 'need') ? Math.max(0, Math.floor(+t.value || 0)) : t.value; mark(); }
    }
  });
  P.addEventListener('change', function (e) {
    var t = e.target;
    if (S.tab === 'music' && t.dataset.mup !== undefined && t.files && t.files.length) { var fl = Array.prototype.slice.call(t.files); t.value = ''; if (S.busy) return; uploadSongs(fl); }
  });
  P.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'dForm') {
      var txt = $('#dText').value.trim(); if (!txt) { A.toast('Write the update first'); return; }
      S.daily.unshift({ id: rid(), date: $('#dDate').value || today(), text: txt, link: $('#dLink').value.trim() }); mark(); render(); A.toast('Added. Publish to put it on the site.');
    }
    if (e.target.id === 'sForm') {
      var st = $('#sText').value.trim(); if (!st) { A.toast('Write the note first'); return; }
      S.help.stories.unshift({ id: rid(), date: $('#sDate').value || today(), text: st }); mark(); render(); A.toast('Added. Publish to put it on the site.');
    }
  });
  $('#sheetHost').addEventListener('click', function (e) { if (e.target.id === 'bg') $('#sheetHost').innerHTML = ''; });

  /* ---------- publish ---------- */
  $('#saveBtn').addEventListener('click', function () {
    var lists = {};
    var body = { daily: S.daily, help: S.help, availability: S.avail };
    Object.keys(LISTS).forEach(function (k) { if (S.lists[k] === null) return; if (LISTS[k].top) body[LISTS[k].top] = S.lists[k]; else lists[k] = S.lists[k]; });
    body.lists = lists;
    if (S.words) body.words = S.words;
    if (S.collab) body.collab = S.collab;
    if (S.forms) body.forms = S.forms;
    if (S.theme) body.theme = S.theme;
    if (S.effects) body.effects = S.effects;
    if (S.voice) body.voice = S.voice;
    if (S.music) body.music = S.music;
    if (S.pets) body.pets = S.pets;
    if (Object.keys(S.i18n).some(function (l) { return Object.keys(S.i18n[l] || {}).length; }) || S.savedI18n) body.i18n = S.i18n;
    var b = $('#saveBtn'); b.disabled = true; $('#saveSt').textContent = 'Publishing…';
    A.put('/api/admin/content', body).then(function (r) {
      S.dirty = false; $('#saveSt').textContent = A.demo ? 'Saved in this preview only' : 'Published. Visitors see it within a minute.'; A.toast(A.demo ? 'Saved in this preview' : 'Published');
      var c = r.content || {}; if (c.help) S.help = Object.assign(clone(HELP0), clone(c.help)); if (c.daily) S.daily = c.daily;
      S.savedI18n = !!c.i18n;
      S.theme = c.theme ? clone(c.theme) : null; S.effects = c.effects ? clone(c.effects) : null; S.voice = c.voice ? clone(c.voice) : null; S.music = c.music ? clone(c.music) : null; S.pets = c.pets ? clone(c.pets) : null; stopPrev();
      render();
    }).catch(function (er) { b.disabled = false; $('#saveSt').textContent = er.message; });
  });
  window.addEventListener('beforeunload', function (e) { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
})();
</script>
